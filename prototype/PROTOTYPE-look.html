<style>
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; overflow: hidden; }
body { font-family: Inter, system-ui, sans-serif; background: #07080b; color: #e9ebf1; }

canvas.world { display: block; cursor: grab; touch-action: none; }

canvas.world:active { cursor: grabbing; }
canvas.world.paint:active { cursor: crosshair; }
#app { position: fixed; inset: 0; }

#switcher { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 100; display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 999px; background: #fff; color: #111; font: 600 12px/1 Inter, sans-serif; box-shadow: 0 6px 24px rgba(0,0,0,.35); border: 2px dashed #ff3b6b; }

.B .stage { position: relative; margin: 28px 0 28px 28px; border: 1px solid #2b2721; background: #f8f4ea; overflow: hidden; }

.C .tip i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }

<body>
<div id="app"></div>
<div id="switcher"><button id="prev" aria-label="Previous variant">&larr;</button><span id="vlabel"></span><button id="next" aria-label="Next variant">&rarr;</button></div>

<script id="genetics-model">
const Genetics = (() => {
  function rand(world) {
    let t = (world.rngState = (world.rngState + 0x6d2b79f5) | 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  function wrapHue(h) {
    return ((h % 360) + 360) % 360;
  }

  function parseRule(text) {
    const m = /^\s*B([0-8]*)\s*\/\s*S([0-8]*)\s*$/i.exec(text);
    if (!m) return null;
    const birth = new Array(9).fill(false);
    const survive = new Array(9).fill(false);
    for (const c of m[1]) birth[+c] = true;
    for (const c of m[2]) survive[+c] = true;
    return { birth, survive, text: `B${[...new Set(m[1])].sort().join('')}/S${[...new Set(m[2])].sort().join('')}` };
  }

  function create({ size, seed, rule, mutationRate = 0, mutationMagnitude = 12 }) {
    const n = size * size;
    return {
      width: size, height: size, generation: 0, rngState: seed | 0,
      rule: parseRule(rule), mutationRate, mutationMagnitude,
      alive: new Uint8Array(n), a1: new Int32Array(n), a2: new Int32Array(n),
      nextAlive: new Uint8Array(n), nextA1: new Int32Array(n), nextA2: new Int32Array(n),
      alleles: { hue: [], dom: [], parent: [], born: [], name: [] },
      founders: [], lastBirths: 0, lastSurprises: 0, lastMutations: 0, totalSurprises: 0,
      populationHistory: [],
    };
  }

  function addAllele(world, hue, dom, parent, name) {
    const A = world.alleles;
    A.hue.push(wrapHue(hue)); A.dom.push(dom); A.parent.push(parent);
    A.born.push(world.generation); A.name.push(name);
    return A.hue.length - 1;
  }

  function addFounder(world, { name, hue, dominance }) {
    const id = addAllele(world, hue, dominance, -1, name);
    world.founders.push(id);
    return id;
  }

  function phenotype(world, a, b) {
    const { hue, dom } = world.alleles;
    if (a === b) return { hue: hue[a], showA: true, showB: true };
    if (dom[a] > dom[b]) return { hue: hue[a], showA: true, showB: false };
    if (dom[b] > dom[a]) return { hue: hue[b], showA: false, showB: true };
    const ha = hue[a], hb = hue[b];
    let d = wrapHue(hb - ha);
    let mid;
    if (d === 180) mid = wrapHue(Math.min(ha, hb) + 90);
    else if (d < 180) mid = wrapHue(ha + d / 2);
    else mid = wrapHue(ha - (360 - d) / 2);
    return { hue: mid, showA: true, showB: true };
  }

  function setCell(world, i, a, b) { world.alive[i] = 1; world.a1[i] = a; world.a2[i] = b; }
  function clearCell(world, i) { world.alive[i] = 0; }
  function clearAll(world) { world.alive.fill(0); }

  function pairsFrom(ids) {
    const pairs = [];
    for (const a of ids) for (const b of ids) pairs.push([a, b]);
    return pairs;
  }

  function soup(world, { density, pairs, x0 = 0, y0 = 0, x1 = world.width, y1 = world.height }) {
    for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
      if (rand(world) < density) {
        const [a, b] = pairs[Math.floor(rand(world) * pairs.length)];
        setCell(world, y * world.width + x, a, b);
      }
    }
  }

  function step(world) {
    const { width: w, height: h, alive, a1, a2, nextAlive, nextA1, nextA2, rule, alleles } = world;
    const live = [];
    for (let i = 0; i < alive.length; i++) if (alive[i]) live.push(i);
    if (world.founders.length === 0) addFounder(world, { name: 'Founder', hue: 200, dominance: 1 });
    let mutated = false;
    const pass = (p) => (rand(world) < 0.5 ? a1[p] : a2[p]);
    const draw = () => live.length > 0
      ? pass(live[Math.floor(rand(world) * live.length)])
      : world.founders[Math.floor(rand(world) * world.founders.length)];
    const mutate = (id) => {
      if (world.mutationRate > 0 && rand(world) < world.mutationRate) {
        mutated = true;
        world.lastMutations++;
        const hue = alleles.hue[id] + (rand(world) * 2 - 1) * world.mutationMagnitude;
        return addAllele(world, hue, Math.floor(rand(world) * 4), id, null);
      }
      return id;
    };
    const nb = new Int32Array(8);
    let births = 0, surprises = 0;
    world.lastMutations = 0;
    for (let y = 0; y < h; y++) {
      const ym = ((y - 1 + h) % h) * w, y0 = y * w, yp = ((y + 1) % h) * w;
      for (let x = 0; x < w; x++) {
        const xm = (x - 1 + w) % w, xp = (x + 1) % w;
        let n = 0;
        const around = [ym + xm, ym + x, ym + xp, y0 + xm, y0 + xp, yp + xm, yp + x, yp + xp];
        for (let k = 0; k < 8; k++) if (alive[around[k]]) nb[n++] = around[k];
        const i = y0 + x;
        if (alive[i]) {
          if (rule.survive[n]) { nextAlive[i] = 1; nextA1[i] = a1[i]; nextA2[i] = a2[i]; }
          else nextAlive[i] = 0;
        } else if (rule.birth[n]) {
          mutated = false;
          let ca, cb, p1 = -1, p2 = -1;
          if (n >= 2) {
            const i1 = Math.floor(rand(world) * n);
            let i2 = Math.floor(rand(world) * (n - 1));
            if (i2 >= i1) i2++;
            p1 = nb[i1]; p2 = nb[i2];
            ca = pass(p1); cb = pass(p2);
          } else if (n === 1) {
            p1 = nb[0];
            ca = pass(p1); cb = draw();
          } else {
            ca = draw(); cb = draw();
          }
          ca = mutate(ca); cb = mutate(cb);
          nextAlive[i] = 1; nextA1[i] = ca; nextA2[i] = cb;
          births++;
          if (p2 >= 0 && !mutated) {
            const c = phenotype(world, ca, cb).hue;
            const h1 = phenotype(world, a1[p1], a2[p1]).hue;
            const h2 = phenotype(world, a1[p2], a2[p2]).hue;
            if (c !== h1 && c !== h2) surprises++;
          }
        } else nextAlive[i] = 0;
      }
    }
    world.alive = nextAlive; world.nextAlive = alive;
    world.a1 = nextA1; world.nextA1 = a1;
    world.a2 = nextA2; world.nextA2 = a2;
    world.generation++;
    world.lastBirths = births; world.lastSurprises = surprises; world.totalSurprises += surprises;
    let pop = 0;
    for (let i = 0; i < world.alive.length; i++) pop += world.alive[i];
    world.populationHistory.push(pop);
    if (world.populationHistory.length > 400) world.populationHistory.shift();
  }

  function census(world) {
    const count = world.alleles.hue.length;
    const copies = new Int32Array(count), showing = new Int32Array(count), hiding = new Int32Array(count);
    const bins = new Array(36).fill(0);
    let population = 0;
    const { alive, a1, a2 } = world;
    for (let i = 0; i < alive.length; i++) {
      if (!alive[i]) continue;
      population++;
      const a = a1[i], b = a2[i];
      const p = phenotype(world, a, b);
      bins[Math.floor(p.hue / 10) % 36]++;
      copies[a]++; copies[b]++;
      if (a === b) { showing[a]++; continue; }
      if (p.showA) showing[a]++; else hiding[a]++;
      if (p.showB) showing[b]++; else hiding[b]++;
    }
    const living = [];
    for (let id = 0; id < count; id++) if (copies[id] > 0) living.push({ id, copies: copies[id], showing: showing[id], hiding: hiding[id] });
    living.sort((x, y) => y.copies - x.copies);
    return { population, living, bins, hidden: living.filter((l) => l.showing === 0).length };
  }

  function lineage(world, id) {
    const chain = [];
    for (let cur = id; cur >= 0; cur = world.alleles.parent[cur]) chain.push(cur);
    return chain;
  }

  function oklchToRgb(L, C, hDeg) {
    const h = (hDeg * Math.PI) / 180;
    const a = C * Math.cos(h), b = C * Math.sin(h);
    const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3;
    const m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3;
    const s = (L - 0.0894841775 * a - 1.291485548 * b) ** 3;
    const lin = [
      4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
      -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
      -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s,
    ];
    return lin.map((v) => {
      const c = v <= 0.0031308 ? 12.92 * v : 1.055 * Math.pow(Math.max(v, 0), 1 / 2.4) - 0.055;
      return Math.round(Math.min(1, Math.max(0, c)) * 255);
    });
  }

  return { parseRule, create, addFounder, phenotype, setCell, clearCell, clearAll, pairsFrom, soup, step, census, lineage, oklchToRgb };
})();
</script>

<script id="shared-runtime">
const S = {
  world: null, running: true, gps: 15, acc: 0, tool: 'look', highlight: -1,
  brushHue: 20, brushAlleles: new Map(), census: null, lastCensus: 0, listeners: new Set(),
};

function newWorld({ size = 160, seed = (Date.now() & 0x7fffffff), founders = 3, density = 0.3, rule = 'B3/S23', mutationRate = 0.01, mutationMagnitude = 30 } = {}) {
  const w = Genetics.create({ size, seed, rule, mutationRate, mutationMagnitude });
  const base = (seed % 360);
  const doms = [2, 1, 0, 3, 1, 2];
  const ids = [];
  for (let k = 0; k < founders; k++) ids.push(Genetics.addFounder(w, { name: null, hue: base + (k * 360) / founders, dominance: doms[k % doms.length] }));
  Genetics.soup(w, { density, pairs: Genetics.pairsFrom(ids) });
  S.world = w; S.highlight = -1; S.brushAlleles = new Map();
  S.census = Genetics.census(w);
  emit();
}

function emit() { for (const f of S.listeners) f(); }
function refreshCensus() { S.census = Genetics.census(S.world); S.lastCensus = performance.now(); }

function makePalette(L, C) {
  const t = new Uint32Array(720);
  for (let i = 0; i < 720; i++) { const [r, g, b] = Genetics.oklchToRgb(L, C, i / 2); t[i] = (255 << 24) | (b << 16) | (g << 8) | r; }
  return { table: t, css: (h) => { const [r, g, b] = Genetics.oklchToRgb(L, C, h); return `rgb(${r},${g},${b})`; }, at: (h) => t[Math.floor(h * 2) % 720] };
}
const rgba = (r, g, b) => (255 << 24) | (b << 16) | (g << 8) | r;

function createView(canvas, { palette, bg, dim, hiddenInk, shape, initialScale = 7, onInspect }) {
  const ctx = canvas.getContext('2d');
  const cam = { ox: 0, oy: 0, s: initialScale };
  let img = null, px = null, W = 0, H = 0, dirty = true, colors = null;
  function resize() {
    const r = canvas.getBoundingClientRect();
    W = Math.max(1, Math.floor(r.width)); H = Math.max(1, Math.floor(r.height));
    canvas.width = W; canvas.height = H;
    img = ctx.createImageData(W, H); px = new Uint32Array(img.data.buffer);
    dirty = true;
  }
  function center() {
    const w = S.world;
    cam.ox = Math.round(W / 2 - (w.width * cam.s) / 2); cam.oy = Math.round(H / 2 - (w.height * cam.s) / 2);
    dirty = true;
  }
  function mask(s) {
    const m = new Uint8Array(s * s);
    for (let y = 0; y < s; y++) for (let x = 0; x < s; x++) {
      let on = 1;
      if (s >= 4 && shape === 'gap') on = x < s - 1 && y < s - 1 ? 1 : 0;
      if (s >= 4 && shape === 'dot') { const dx = x + 0.5 - s / 2, dy = y + 0.5 - s / 2; on = dx * dx + dy * dy <= (s * 0.42) ** 2 ? 1 : 0; }
      m[y * s + x] = on;
    }
    return m;
  }
  function draw() {
    const w = S.world, n = w.width * w.height;
    if (!colors || colors.length !== n) colors = new Uint32Array(n);
    const { alive, a1, a2 } = w, hl = S.highlight;
    for (let i = 0; i < n; i++) {
      if (!alive[i]) { colors[i] = bg; continue; }
      const a = a1[i], b = a2[i], p = Genetics.phenotype(w, a, b);
      if (hl >= 0) {
        if (a === hl || b === hl) colors[i] = (a === hl && p.showA) || (b === hl && p.showB) ? palette.at(p.hue) : hiddenInk;
        else colors[i] = dim;
      } else colors[i] = palette.at(p.hue);
    }
    const s = cam.s, m = mask(s), ww = w.width, wh = w.height;
    const colCell = new Int32Array(W), colIn = new Int32Array(W);
    for (let x = 0; x < W; x++) { const r = x - cam.ox, c = Math.floor(r / s); colCell[x] = ((c % ww) + ww) % ww; colIn[x] = r - c * s; }
    for (let y = 0; y < H; y++) {
      const r = y - cam.oy, c = Math.floor(r / s), row = (((c % wh) + wh) % wh) * ww, inY = (r - c * s) * s, o = y * W;
      for (let x = 0; x < W; x++) px[o + x] = m[inY + colIn[x]] ? colors[row + colCell[x]] : bg;

      const w = S.world, dr = dish.getBoundingClientRect();
      if (!w.alive[i]) { tip.style.display = 'none'; return; }
      const a = w.a1[i], b = w.a2[i], p = Genetics.phenotype(w, a, b), A = w.alleles;
      const g = (id, on) => `<div><i style="background:${P.css(A.hue[id])}"></i>${A.hue[id].toFixed(0)}° d${A.dom[id]} ${on ? 'shown' : 'hidden'}</div>`;
      tip.innerHTML = `<div><i style="background:${P.css(p.hue)}"></i><b>${a === b ? 'pure' : p.showA && p.showB ? 'blend' : 'carrier'}</b></div>${g(a, p.showA)}${a === b ? '' : g(b, p.showB)}`;
      tip.style.left = cx - dr.left + 14 + 'px'; tip.style.top = cy - dr.top + 14 + 'px'; tip.style.display = 'block';
    },
  });
  const rctx = ring.getContext('2d');
  let marks = [];
  function drawRing() {
    const W = ring.width, cx = W / 2, c = S.census, A = S.world.alleles;
    rctx.clearRect(0, 0, W, W);
    const r0 = D + 12, bins = 120, geneBins = new Array(bins).fill(0), showBins = new Array(bins).fill(0);
    for (const l of c.living) { const k = Math.floor((A.hue[l.id] / 360) * bins) % bins; geneBins[k] += l.copies; showBins[k] += l.showing; }
    const gm = Math.max(1, ...geneBins), sm = Math.max(1, ...showBins);
    for (let k = 0; k < bins; k++) {
      const a0 = (k / bins) * Math.PI * 2 - Math.PI / 2, a1 = ((k + 1) / bins) * Math.PI * 2 - Math.PI / 2 - 0.006, hue = ((k + 0.5) / bins) * 360;
      rctx.strokeStyle = P.css(hue);
      rctx.globalAlpha = 0.12; rctx.lineWidth = 2; rctx.beginPath(); rctx.arc(cx, cx, r0 + 60, a0, a1); rctx.stroke();
      if (geneBins[k]) { rctx.globalAlpha = 0.95; rctx.lineWidth = 4 + 60 * (geneBins[k] / gm); rctx.beginPath(); rctx.arc(cx, cx, r0 + 90 + rctx.lineWidth / 2, a0, a1); rctx.stroke(); }
      if (showBins[k]) { rctx.globalAlpha = 0.45; rctx.lineWidth = 3 + 26 * (showBins[k] / sm); rctx.beginPath(); rctx.arc(cx, cx, r0 + 40, a0, a1); rctx.stroke(); }
    }
    rctx.globalAlpha = 1; marks = [];
    for (const l of c.living) {
      const ang = (A.hue[l.id] / 360) * Math.PI * 2 - Math.PI / 2, rr = r0 + 70;
      const x = cx + Math.cos(ang) * rr, y = cx + Math.sin(ang) * rr;
      marks.push([x / 2, y / 2, l.id]);
      if (l.showing === 0 || S.highlight === l.id) {
        rctx.beginPath(); rctx.arc(x, y, S.highlight === l.id ? 9 : 6, 0, 7);
        rctx.strokeStyle = S.highlight === l.id ? '#fff' : P.css(A.hue[l.id]); rctx.lineWidth = 2.5; rctx.stroke();
      }
    }
  }
  ring.addEventListener('click', (e) => {
    const r = ring.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    const cx = r.width / 2, ang = (Math.atan2(y - cx, x - cx) + Math.PI / 2 + Math.PI * 2) % (Math.PI * 2), hue = (ang / (Math.PI * 2)) * 360;
    let best = -1, bd = 1e9;
    for (const l of S.census.living) { const h = S.world.alleles.hue[l.id]; const d = Math.min(Math.abs(h - hue), 360 - Math.abs(h - hue)) - Math.log(l.copies + 1) * 0.3; if (d < bd) { bd = d; best = l.id; } }
    if (best >= 0) toggleHighlight(best);
  });
  function setTool(t) { S.tool = t; $('c-look').classList.toggle('on', t === 'look'); $('c-paint').classList.toggle('on', t === 'paint'); canvas.classList.toggle('paint', t === 'paint'); tip.style.display = 'none'; }
  $('c-play').onclick = () => { S.running = !S.running; render(); };
  $('c-step').onclick = () => { S.running = false; stepOnce(); };
  $('c-speed').oninput = (e) => { S.gps = +e.target.value; };
  $('c-look').onclick = () => setTool('look');
  $('c-paint').onclick = () => setTool('paint');
  $('c-new').onclick = () => { newWorld(); view.recenter(); view.markDirty(); tip.style.display = 'none'; };
  setTool(S.tool);
  function render() {
    $('c-play').textContent = S.running ? 'pause' : 'play';
    $('c-gen').textContent = `gen ${S.world.generation} · ${S.census.living.length} genes · ${S.census.hidden} hidden`;
    drawRing();
  }
  const ro = new ResizeObserver(layout); ro.observe(dish);
  layout();
  S.listeners.add(render); render();
  return { frame: (stepped) => { if (stepped) view.markDirty(); view.frame(); }, destroy() { S.listeners.delete(render); view.destroy(); ro.disconnect(); } };
}
VariantC.title = 'Chromatic wheel';
</script>

<script id="switcher-script">
const VARIANTS = { A: VariantA, B: VariantB, C: VariantC };
const KEYS = Object.keys(VARIANTS);
function mount(key) {
  if (!VARIANTS[key]) key = 'A';
  if (current) current.destroy();
  S.highlight = -1;
  const app = document.getElementById('app');
  app.innerHTML = '';
  current = VARIANTS[key](app);
  const url = new URL(location.href); url.searchParams.set('variant', key); history.replaceState(null, '', url);
  document.getElementById('vlabel').textContent = `${key} (${VARIANTS[key].title})`;
  document.getElementById('switcher').dataset.key = key;
}
function cycle(d) { const k = document.getElementById('switcher').dataset.key; mount(KEYS[(KEYS.indexOf(k) + d + KEYS.length) % KEYS.length]); }
document.getElementById('prev').onclick = () => cycle(-1);
document.getElementById('next').onclick = () => cycle(1);
document.addEventListener('keydown', (e) => {
  const t = e.target; if (t.matches && t.matches('input, textarea, select, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') cycle(-1);
  if (e.key === 'ArrowRight') cycle(1);
  if (e.code === 'Space') { e.preventDefault(); S.running = !S.running; emit(); }
});
newWorld();
mount(new URLSearchParams(location.search).get('variant') || 'A');
requestAnimationFrame((t) => { lastT = t; requestAnimationFrame(loop); });
</script>
